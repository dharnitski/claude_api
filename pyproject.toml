[project]
name = "claude-api"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "anthropic",
    "python-dotenv",
    "mcp[cli]<2",
    "prompt-toolkit",
    "pydantic",
]

[dependency-groups]
dev = [
    "pytest",
    "pytest-asyncio",
    "ruff",
    "mypy",
]

[tool.pylint.messages_control]
disable = [
    "missing-function-docstring",
]

[tool.mypy]
strict = true
