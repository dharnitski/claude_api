[project]
name = "claude-api"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "anthropic",
    "python-dotenv",
    "mcp[cli]<2",
    "prompt-toolkit",
    "pydantic",
]

[dependency-groups]
dev = [
    "pytest",
    "pytest-asyncio",
    "ruff",
    "mypy",
]

[tool.ruff]
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "ASYNC", "S", "PTH", "RUF", "C4"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]

[tool.pytest.ini_options]
pythonpath = ["."]
asyncio_mode = "auto"

[tool.mypy]
strict = true
